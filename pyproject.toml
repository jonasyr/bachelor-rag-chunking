[project]
name = "bachelor-rag-chunking"
version = "0.1.0"
description = "Einfluss von Chunking-Strategien auf die Retrieval- und Antwortqualität eines RAG-Systems für technische Projektdokumentation"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
dependencies = [
    # OpenAI (LLM + embeddings)
    "openai==2.44.0",  # pinned (ADR 0023)
    # Vector store
    "chromadb==1.5.9",  # pinned (ADR 0023)
    # Token counting
    "tiktoken==0.13.0",  # pinned (ADR 0019)
    # Environment
    "python-dotenv>=1.0.0",
    # Data
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    # Visualisation
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    # Dashboard
    "streamlit>=1.35.0",
    # Secondary evaluation (RAGAS)
    "ragas>=0.1.0",
    "markdown-it-py>=3",
    "scipy==1.17.1",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# F401: the pipeline skeleton imports config values for steps not implemented yet;
# re-enable once src/ is implemented.
ignore = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
# Editor type checking: scripts import siblings from src/ and run in the uv venv.
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
