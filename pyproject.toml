[project]
name = "bachelor-rag-chunking"
version = "0.1.0"
description = "Einfluss von Chunking-Strategien auf die Retrieval- und Antwortqualität eines RAG-Systems für technische Projektdokumentation"
requires-python = ">=3.11"
dependencies = [
    # OpenAI (LLM + embeddings)
    "openai>=1.30.0",
    # Vector store
    "chromadb>=0.5.0",
    # Token counting
    "tiktoken>=0.7.0",
    # Environment
    "python-dotenv>=1.0.0",
    # Data
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    # Markdown processing
    "markdown>=3.6",
    # Visualisation
    "matplotlib>=3.8.0",
    "plotly>=5.20.0",
    # Dashboard
    "streamlit>=1.35.0",
    # Secondary evaluation (RAGAS)
    "ragas>=0.1.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]
