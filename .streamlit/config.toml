# Theme of the catalogue editor (spec 2026-10-14-catalogue-authoring, "Visual design").
# Light and dark follow the system setting or Streamlit's settings menu.
[theme]
borderColor = "#D9DEE4"
font = "sans-serif"

[theme.light]
primaryColor = "#2457A6"
backgroundColor = "#FAFBFC"
secondaryBackgroundColor = "#F1F3F6"
textColor = "#1F2933"
borderColor = "#D9DEE4"

[theme.dark]
# #3F72C9: white button text 4.71:1, on the dark background 3.75:1 (WCAG AA)
primaryColor = "#3F72C9"
backgroundColor = "#15191E"
secondaryBackgroundColor = "#1D232A"
textColor = "#E4E8EC"
borderColor = "#2E3640"

[client]
# "viewer" keeps the theme switch in the menu (default: system setting); no developer options
toolbarMode = "viewer"

[server]
# Local only: the editor works on the thesis data and must not be reachable from the network
address = "localhost"
headless = true

[browser]
gatherUsageStats = false
