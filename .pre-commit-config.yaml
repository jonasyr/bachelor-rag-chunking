# Install once per clone:  uv tool install pre-commit && pre-commit install
# The corpus snapshot stays byte-identical to its checksums (ADR 0048): no hook may touch it.
exclude: ^data/raw/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=5120]
        exclude: ^data/processed/embeddings_(c1|c2|c3|k1)\.npz$  # chunk vectors, ADR 0048
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
